<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#efeee9">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="same-origin">
  <title>KUBA BALIE — Dostęp do konfiguratora</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/fonts/fonts.css">
  <style>
    :root{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#34372f;background:#efeee9;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #848165;outline-offset:3px}.gate-header{height:72px;border-bottom:1px solid #e0dfd8;background:#fafaf7;display:flex;align-items:center;justify-content:space-between;padding:0 38px}.gate-brand{display:flex;align-items:center;gap:23px;font:700 18px/1 'Manrope',sans-serif;letter-spacing:2px}.gate-brand span{padding-left:23px;border-left:1px solid #d8d8cf;font:400 12px/1 'DM Sans',sans-serif;letter-spacing:0;color:#74766b}.gate-header>span{font-size:11px;color:#74766b}.gate-main{flex:1;display:grid;place-items:center;padding:54px 24px}.gate-card{width:min(100%,370px);padding:14px 0 25px}.gate-icon{display:none}.gate-eyebrow{font-size:9px;color:#74766b;letter-spacing:1.8px;font-weight:400;margin:0 0 11px}h1{font:500 29px/1.3 'Manrope',sans-serif;letter-spacing:-1px;margin:0 0 15px}.gate-description{font-size:13px;line-height:1.8;color:#74766b;margin:0 0 30px}.gate-label{display:block;font-size:12px;font-weight:400;color:#74766b;margin-bottom:10px}.gate-password{display:flex;align-items:stretch;border:1px solid #cfd4c2;border-radius:2px;background:#fafbf7}.gate-password:focus-within{border-color:#858b6b}.gate-password input{min-width:0;flex:1;width:100%;height:48px;border:0;border-radius:2px;background:none;padding:0 13px;font-size:16px;color:#34372f;outline-offset:-3px}.gate-password button{width:47px;min-height:48px;border:0;background:none;color:#74766b;display:grid;place-items:center;border-radius:2px}.gate-password button:hover{background:#edf1e5}.gate-password button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.gate-remember{display:flex;align-items:center;gap:10px;min-height:44px;margin:12px 0 19px;font-size:11px;color:#74766b;cursor:pointer}.gate-remember input{width:15px;height:15px;accent-color:#7e8d65;margin:0}.gate-submit{width:100%;min-height:48px;border:1px solid #303a27;border-radius:2px;background:#303a27;color:white;font-size:12px;font-weight:400;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 17px}.gate-submit:hover{background:#48563c}.gate-submit:disabled{opacity:.65;cursor:wait}.gate-submit svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.gate-message{font-size:12px;line-height:1.7;color:#74766b;margin:15px 0 0;min-height:0}.gate-message:empty{display:none}.gate-footnote{border-top:1px solid #dce4ce;margin:27px 0 0;padding-top:20px;font-size:10px;color:#74766b;line-height:1.7}.gate-footer{display:flex;justify-content:space-between;gap:20px;padding:24px 38px;font-size:10px;color:#74766b}.gate-loading .gate-submit svg{animation:gate-pulse 1s ease infinite}@keyframes gate-pulse{50%{opacity:.3}}@media(max-width:520px){.gate-header{height:64px;padding:0 21px}.gate-brand{font-size:15px;letter-spacing:1.5px}.gate-brand span,.gate-header>span{display:none}.gate-main{padding:42px 27px}.gate-card{padding:0}h1{font-size:27px}.gate-footer{padding:22px 25px;font-size:9px;flex-wrap:wrap;gap:8px}.gate-footer>span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <script src="./gate.js" defer></script>
</head>
<body>
  <header class="gate-header"><div class="gate-brand">KUBA BALIE<span>Konfigurator</span></div><span>Projekt indywidualny</span></header>
  <main class="gate-main"><section class="gate-card" aria-labelledby="gate-title">
    <div class="gate-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg></div>
    <p class="gate-eyebrow">DOSTĘP DO PROJEKTU</p>
    <h1 id="gate-title">Konfigurator balii</h1>
    <p class="gate-description">Wprowadź hasło, aby otworzyć projekt i dobrać wyposażenie balii.</p>
    <form id="gate-form">
      <label for="gate-password" class="gate-label">Hasło dostępu</label>
      <div class="gate-password"><input id="gate-password" type="password" autocomplete="current-password" required maxlength="256" aria-describedby="gate-message" autofocus><button type="button" id="gate-reveal" aria-label="Pokaż hasło" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <label class="gate-remember"><input type="checkbox" id="gate-remember">Zapamiętaj dostęp w tej karcie</label>
      <button class="gate-submit" type="submit" id="gate-submit"><span id="gate-submit-label">Otwórz konfigurator</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      <p id="gate-message" class="gate-message" role="status" aria-live="polite"></p>
    </form>
    <p class="gate-footnote">Materiały · układ dysz · ogrzewanie · wyposażenie</p>
    <noscript><p class="gate-message">Włącz JavaScript, aby otworzyć konfigurator.</p></noscript>
  </section></main>
  <footer class="gate-footer"><span>© 2026 KUBA BALIE</span><span>Indywidualna konfiguracja balii ogrodowej</span></footer>
</body>
</html>
