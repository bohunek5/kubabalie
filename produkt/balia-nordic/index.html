*{box-sizing:border-box}body{margin:0;background:#f2f0e9;color:#24382f;font-family:Arial,sans-serif;min-height:100dvh;display:flex;flex-direction:column}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #a77957;outline-offset:4px}.gate-header{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;border-bottom:1px solid #d6d9cf;gap:30px}.gate-logo{width:150px;height:86px;object-fit:contain}.gate-header>span{text-transform:uppercase;font-size:10px;letter-spacing:.17em;color:#647167}.gate-main{display:grid;place-items:center;flex:1;padding:55px 24px}.gate-card{width:min(100%,420px)}.gate-eyebrow{font-size:10px;letter-spacing:.18em;margin:0 0 18px;text-transform:uppercase;color:#67756a}h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(43px,5vw,64px);line-height:1.03;letter-spacing:-.035em;margin:0 0 22px}.gate-description{font-size:14px;line-height:1.85;color:#647167;margin:0 0 30px}.gate-label{font-size:12px;display:block;margin:0 0 11px}.gate-password{display:flex;border:1px solid #aeb9aa;min-height:52px}.gate-password:focus-within{border-color:#293d34}.gate-password input{background:transparent;border:0;min-width:0;flex:1;font-size:18px;padding:13px 15px;color:inherit}.gate-password button{width:52px;background:transparent;border:0;color:inherit;display:grid;place-items:center}.gate-password svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5}.gate-remember{display:flex;align-items:center;gap:10px;font-size:12px;min-height:50px;margin:8px 0 13px;cursor:pointer}.gate-remember input{width:18px;height:18px;accent-color:#293d34}.gate-submit{width:100%;background:#293d34;color:#fff;border:1px solid #293d34;padding:17px 20px;min-height:54px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.gate-submit:hover{background:#1f3027}.gate-submit:disabled{opacity:.6;cursor:wait}.gate-message{font-size:13px;line-height:1.7;color:#8e4b31;margin:17px 0 0}.gate-message:empty{display:none}.gate-footnote{font-size:11px;color:#67756a;line-height:1.8;border-top:1px solid #d6d9cf;margin:27px 0 0;padding:20px 0 0}.gate-footer{display:flex;justify-content:space-between;gap:20px;padding:24px 5vw;font-size:10px;color:#67756a}@media(max-width:520px){.gate-header{padding:14px 23px}.gate-logo{width:125px;height:75px}.gate-header>span{font-size:8px;max-width:110px;line-height:1.6;text-align:right}.gate-main{padding:38px 25px}.gate-footer{padding:20px 25px;flex-direction:column;gap:8px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gate-logo{display:block;color:#293d34}.gate-logo svg{width:100%;height:100%;display:block}.brand-flame-light{opacity:.16;animation:gate-flame 7s ease-in-out infinite}@keyframes gate-flame{0%,100%{opacity:.06}50%{opacity:.6}}h1{font-weight:500}@media(prefers-reduced-motion:reduce){.brand-flame-light{animation:none;opacity:.16}}.gate-header>span{flex-shrink:0;max-width:none}.gate-header-tools{display:flex;align-items:center;gap:18px}.gate-caption{text-transform:uppercase;font-size:10px;letter-spacing:.17em;color:#647167}.gate-language-control select{min-height:44px;min-width:76px;padding:0 9px;border:1px solid #aeb9aa;border-radius:0;background:transparent;color:#24382f;font-size:11px;cursor:pointer}.gate-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:520px){.gate-header{gap:18px}.gate-header-tools{flex-direction:column;align-items:flex-end;gap:5px}.gate-caption{font-size:8px;max-width:130px;line-height:1.6;text-align:right}.gate-language-control select{min-width:76px}}</style><script src="/kubabalie/gate.js" defer></script>

<main class="gate-main"><section class="gate-card" aria-labelledby="gate-title"><p class="gate-eyebrow" data-gate-i18n="eyebrow">Twoja przestrzeń odpoczynku</p><h1 id="gate-title" data-gate-i18n="title">Zobacz, co możemy stworzyć.</h1><p class="gate-description" data-gate-i18n="description">Strona, kolekcja i konfiguratory Suwalskiej Strefy Ciepła. Wprowadź hasło, aby otworzyć prezentację.</p><form id="gate-form"><label class="gate-label" for="gate-password" data-gate-i18n="password">Hasło dostępu</label><div class="gate-password"><input id="gate-password" type="password" required autocomplete="current-password" maxlength="256" aria-describedby="gate-message" autofocus><button id="gate-reveal" type="button" aria-label="Pokaż hasło" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><label class="gate-remember"><input id="gate-remember" type="checkbox"><span data-gate-i18n="remember">Zapamiętaj dostęp w tej karcie</span></label><button id="gate-submit" class="gate-submit" type="submit"><span id="gate-submit-label">Otwórz prezentację</span><span aria-hidden="true">↗</span></button><p id="gate-message" class="gate-message" role="status" aria-live="polite"></p></form><p class="gate-footnote" data-gate-i18n="footnote">Sauny · balie · Twój własny kompleks SPA</p><noscript><div class="gate-message"><p lang="pl">Włącz JavaScript, aby otworzyć prezentację.</p><p lang="en">Enable JavaScript to open the presentation.</p><p lang="de">Aktivieren Sie JavaScript, um die Präsentation zu öffnen.</p><p lang="lt">Įjunkite JavaScript, kad atidarytumėte pristatymą.</p><p lang="hu">A bemutató megnyitásához engedélyezze a JavaScriptet.</p><p lang="cs">Pro otevření prezentace povolte JavaScript.</p></div></noscript></section></main><footer class="gate-footer"><span>© Suwalska Strefa Ciepła</span><span data-gate-i18n="footer">Materiały do prezentacji projektu</span><
