<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" role="img" aria-labelledby="ssc-vector-title"><title id="ssc-vector-title">Suwalska Strefa Ciepła</title><!-- Original symbol and serif lettering reconstructed as paths; no raster artwork or runtime font. --><style>
.ssc-vector-fire-enter{transform-box:fill-box;transform-origin:50% 100%;animation:ssc-brand-ignite 1.1s cubic-bezier(.2,.7,.2,1) both}
.ssc-vector-fire{transform-box:fill-box;transform-origin:50% 100%;animation:ssc-brand-flame 4.8s ease-in-out infinite}
.ssc-vector-flame-trace{stroke:var(--ssc-brand-gold,#b9975a);stroke-width:.7;stroke-linejoin:round;opacity:.6;animation:ssc-brand-ember 4.8s ease-in-out infinite}
.ssc-vector-dome{stroke-dasharray:180;stroke-dashoffset:0;animation:ssc-brand-draw 1.8s cubic-bezier(.2,.65,.2,1) both}
.ssc-vector-wave{transform-box:fill-box;transform-origin:center;stroke:var(--ssc-brand-water,#087f8c);animation:ssc-brand-wave 4s ease-in-out infinite}
.ssc-vector-bubble{transform-box:fill-box;transform-origin:center;fill:var(--ssc-brand-water,#087f8c);stroke:none;animation:ssc-brand-bubble 3.8s ease-in-out infinite;animation-delay:var(--ssc-delay,0s)}
.ssc-vector-sauna-glow{stroke:var(--ssc-brand-gold,#b9975a);animation:ssc-brand-glow 5.6s ease-in-out infinite}
.ssc-vector-brand:hover .ssc-vector-fire,.ssc-vector-brand:focus-within .ssc-vector-fire{animation-duration:2.2s}
.ssc-vector-brand:hover .ssc-vector-flame-trace{stroke-width:1;opacity:1}
.ssc-vector-brand:hover .ssc-vector-wave{animation-duration:2.1s}
body[data-motion="paused"] .ssc-vector-brand *{animation-play-state:paused!important}
body[data-motion="paused"] .ssc-vector-fire-enter,body[data-motion="paused"] .ssc-vector-dome{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}
body[data-site-theme="night"] .ssc-vector-brand{--ssc-brand-water:#70c8d1;--ssc-brand-gold:#d3b67c}
