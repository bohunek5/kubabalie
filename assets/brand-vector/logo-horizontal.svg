@keyframes ssc-brand-flame{0%,100%{transform:skewX(-2deg) scale(.98,1)}30%{transform:skewX(2.5deg) scale(1.015,1.065)}65%{transform:skewX(-1deg) scale(.97,.97)}}
@keyframes ssc-brand-ember{0%,100%{opacity:.25}40%{opacity:.85}70%{opacity:.4}}
@keyframes ssc-brand-draw{from{stroke-dashoffset:180;opacity:.25}to{stroke-dashoffset:0;opacity:1}}
@keyframes ssc-brand-wave{0%,100%{transform:translate(-.75px,.1px)}50%{transform:translate(.75px,-.25px)}}
@keyframes ssc-brand-bubble{0%,12%{opacity:0;transform:translateY(1.2px) scale(.6)}30%,65%{opacity:.85}90%,100%{opacity:0;transform:translateY(-2.5px) scale(1.1)}}
@keyframes ssc-brand-glow{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
